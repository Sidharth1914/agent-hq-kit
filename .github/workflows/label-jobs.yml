name: label new jobs

# A new or reopened issue from the repo owner becomes a job: it gets the runner label
# (needs-local, or the repo variable HQ_DEFAULT_LABEL) so the server or PC picks it up within minutes.
on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  label:
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ' ') }}
          DEFAULT: ${{ vars.HQ_DEFAULT_LABEL || 'needs-local' }}
        run: |
          case " $LABELS " in *" needs-local "*|*" needs-windows "*|*" working "*) exit 0;; esac
          gh issue edit "$N" -R "$GITHUB_REPOSITORY" --add-label "$DEFAULT" --remove-label done --remove-label failed
